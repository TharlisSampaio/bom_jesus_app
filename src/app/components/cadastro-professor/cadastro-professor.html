<h1 class="h4 mb-4">Novo professor</h1>

<form class="col-md-5 col-lg-4" [formGroup]="form" (ngSubmit)="salvar()" style="font-size: 0.875rem;">

  <!-- Campo Nome -->
  <div class="mb-2">
    <label class="form-label mb-1">Nome</label>
    <input class="form-control form-control-sm" formControlName="name"
      [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid" />
    <div class="invalid-feedback" style="font-size: 0.775rem;">Informe o nome (mínimo 3 letras).</div>
  </div>

  <!-- Campo Telefone -->
  <div class="mb-2">
    <label class="form-label mb-1">Telefone</label>
    <input class="form-control form-control-sm" formControlName="phoneNumber"
      [class.is-invalid]="form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid" />
    <div class="invalid-feedback" style="font-size: 0.775rem;">Informe o telefone.</div>
  </div>

  <!-- Campo E-mail -->
  <div class="mb-2">
    <label class="form-label mb-1">E-mail</label>
    <input type="email" class="form-control form-control-sm" formControlName="emailAddress"
      [class.is-invalid]="form.controls.emailAddress.touched && form.controls.emailAddress.invalid" />
    <div class="invalid-feedback" style="font-size: 0.775rem;">Informe um e-mail válido.</div>
  </div>

  <!-- Campo Salário (Substituindo Matrícula) -->
  <div class="mb-3">
    <label class="form-label mb-1">Salário (R$)</label>
    <input type="number" step="0.01" class="form-control form-control-sm" formControlName="salary"
      [class.is-invalid]="form.controls.salary.touched && form.controls.salary.invalid" />
    <div class="invalid-feedback" style="font-size: 0.775rem;">Informe um salário válido.</div>
  </div>

  <hr class="my-3">

  <!-- Bloco de Endereço vinculado ao FormArray -->
  <hr class="my-3">

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0 fw-bold">Endereços</h6>
    <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" (click)="adicionarEndereco()"
      style="font-size: 0.75rem;">
      + Adicionar outro endereço
    </button>
  </div>

  <!-- 1. Vincula ao FormArray -->
  <div formArrayName="address">
    @for (control of addressControls; track $index) {
    <!-- 2. OBRIGATÓRIO: Vincula o grupo ao índice do loop -->
    <div [formGroupName]="$index" class="p-2 mb-3 border rounded bg-light position-relative">

      @if (addressControls.length > 1) {
      <button type="button" class="btn-close position-absolute top-0 end-0 m-2" style="font-size: 0.65rem;"
        (click)="removerEndereco($index)"></button>
      }

      <!-- Campo Rua -->
      <div class="mb-2">
        <label class="form-label mb-1">Rua</label>
        <!-- 3. OBRIGATÓRIO: formControlName -->
        <input class="form-control form-control-sm" formControlName="street" />
      </div>

      <!-- Grid de Cidade, UF e CEP -->
      <div class="row g-2">
        <div class="col-md-6 mb-2">
          <label class="form-label mb-1">Cidade</label>
          <!-- 4. OBRIGATÓRIO: formControlName -->
          <input class="form-control form-control-sm" formControlName="city" />
        </div>
        <div class="col-md-2 mb-2">
          <label class="form-label mb-1">UF</label>
          <!-- 5. OBRIGATÓRIO: formControlName -->
          <input class="form-control form-control-sm" formControlName="state" max-length="2" />
        </div>
        <div class="col-md-4 mb-2">
          <label class="form-label mb-1">CEP</label>
          <!-- 6. OBRIGATÓRIO: formControlName -->
          <input class="form-control form-control-sm" formControlName="zipCode" />
        </div>
      </div>
    </div>
    }
  </div>


  <!-- Botões compactos com btn-sm -->
  <div class="mt-3">
    <button type="submit" class="btn btn-sm btn-primary me-2" [disabled]="form.invalid">Salvar</button>
    <a routerLink="/professores" class="btn btn-sm btn-outline-secondary">Cancelar</a>
  </div>
</form>
